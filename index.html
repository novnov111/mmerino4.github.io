<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Merino's Home Page</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <style>
/* ---- Base ---- */
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #c7ccd4;
    color: #1f2d3d;
    margin: 0;
    padding: 30px 20px;
}

/* ---- Shared "card" look for header, main, footer ---- */
header,
main,
footer {
    background-color: #ffffff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    max-width: 900px;
    margin: 0 auto 25px auto;
    padding: 30px 40px;
}

/* ---- Header ---- */
header {
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 2em;
}

/* ---- Figure / photo placeholder ---- */
figure {
    text-align: left;
    margin: 0 0 20px 0;
}

figure img {
    max-width: 200px;
    height: auto;
    display: block;
    border-radius: 4px;
}

figcaption {
    margin-top: 5px;
    font-style: italic;
    font-size: 0.9em;
    color: #5a6b7d;
}

/* ---- Tagline / quicklinks ---- */
.tagline {
    font-style: italic;
    color: #5a6b7d;
}

.quicklinks a {
    color: #2c3e50;
    text-decoration: underline;
    margin-right: 5px;
}

/* ---- Dashed divider ---- */
hr.dashed {
    border: none;
    border-top: 2px dashed #8a94a3;
    margin: 20px 0;
}

/* ---- Headings and lists ---- */
main h2 {
    color: #2c3e50;
    margin-top: 25px;
}

main ul {
    line-height: 1.8;
}

.root-note {
    font-weight: bold;
    margin-top: 20px;
}

/* ---- Footer ---- */
footer {
    text-align: center;
}

footer nav a {
    margin: 0 10px;
    color: #1f3a5f;
    text-decoration: underline;
}

footer p {
    margin-top: 15px;
    color: #5a6b7d;
}
</style>
</head>
<body>
    <header>
        <h1>Michael Merino's home page</h1>
        <p>Welcome to my Computer science class. There are more stuff if you follow the next page</p>
    </header>
    <main>
        <h2>Hello there, Welcome</h2>
        <p>Nice to have you here. This is my class main page </p>
    </main>
    <footer>
        <nav>
            <a href="itis3135/">Link to my course page</a>
            <h3>This is the root page</h3>
        </nav>
    </footer>
    <p>Michael Merino ©2026</p>
</body>
</html>
